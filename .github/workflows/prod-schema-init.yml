name: PROD - Initialize canonical schema

on:
  push:
    branches:
      - prod-schema-init-20260926
    paths:
      - .github/workflows/prod-schema-init.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
      ASPNETCORE_ENVIRONMENT: Production
      Database__ServerVersion: "8.4.8"
      Database__ApplyMigrationsOnStartup: "false"

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MySQL client and EF CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client
          dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Guard empty canonical PROD database
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_prod"
          test "$DB_USER" = "solqaryn_prod_user"
          test -n "$DB_HOST"
          test -n "$DB_PORT"
          test -n "$DB_PASSWORD"
          echo "::add-mask::$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"
          mysql_cmd=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          db="$("${mysql_cmd[@]}" -e 'SELECT DATABASE();')"
          test "$db" = "solqaryn_prod"
          tables="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          test "$tables" = "0"
          echo "PROD_SCHEMA_INIT_PREFLIGHT=PASS"
          echo "PROD_BASE_TABLES_BEFORE=0"

      - name: Apply current EF schema only
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$DB_PASSWORD"
          export ConnectionStrings__DefaultConnection="Server=$DB_HOST;Port=$DB_PORT;Database=$DB_NAME;User=$DB_USER;Password=$DB_PASSWORD;SslMode=Required;AllowPublicKeyRetrieval=True;"
          expected="$(find src/Infrastructure/Migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{14}_.+\.cs' ! -name '*.Designer.cs' | wc -l | tr -d ' ')"
          test "$expected" -gt 0
          echo "EXPECTED_MIGRATIONS=$expected"
          dotnet restore InventoryApp.sln
          dotnet ef database update             --project src/Infrastructure/InventoryApp.Infrastructure.csproj             --startup-project src/API/InventoryApp.API.csproj             --context AppDbContext
          echo "PROD_SCHEMA_MIGRATION_APPLY=PASS"

      - name: Verify schema and migration history
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"
          mysql_cmd=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          tables="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          history="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM __EFMigrationsHistory;")"
          expected="$(find backend/src/Infrastructure/Migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{14}_.+\.cs' ! -name '*.Designer.cs' | wc -l | tr -d ' ')"
          test "$tables" -gt 0
          test "$history" = "$expected"
          echo "PROD_BASE_TABLES_AFTER=$tables"
          echo "PROD_EF_MIGRATIONS_AFTER=$history"
          echo "PROD_SCHEMA_INIT=PASS"
          echo "LEGACY_BACKUP_RESTORED=FALSE"
